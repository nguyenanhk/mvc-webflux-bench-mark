
services:
  mvc-app:
    build:
      context: ./mvc-app
      dockerfile: Dockerfile
    image: bench-mvc:latest
    container_name: bench-mvc
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bench
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8080
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    networks:
      - bench-net

networks:
  bench-net:
    external: true
