networks:
  bench-net:
    external: true

services:
  kong:
    image: kong:3.4
    container_name: kong
    environment:
      KONG_DATABASE: off                # ✅ DB-less mode
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: info
    ports:
      - "8000:8000"   # Public gateway port
      - "8001:8001"   # Admin API
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    networks:
      - bench-net
