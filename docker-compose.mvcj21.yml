
services:
  mvc-app-j21:
    build:
      context: ./mvc-app-j21
      dockerfile: Dockerfile
    image: bench-mvc-j21:latest
    container_name: bench-mvc-j21
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bench
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8082
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    networks:
      - bench-net

networks:
  bench-net:
    external: true
